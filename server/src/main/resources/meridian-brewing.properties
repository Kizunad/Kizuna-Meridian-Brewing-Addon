kidney.ordinary=1.0
kidney.good=1.8
kidney.excellent=2.5
kidney.harmless=4.0
brain.stagger=700
brain.ignore=1200
charm_controls_players=true
# 熬药耗真元（占位数值）：每锅基数，乘釜的系数（铜釜 1.0、巫釜 1.3），熬制 30 秒里每秒付 1/30。
# 先取环境（施法者所在区块的环境真元），不够的再从施法者已开经脉里扣；两边都不够就不起熬。
# 中途两边都付不满就记欠付，之后每秒连欠的一起要；累计欠付超过 grace_seconds 秒的份才中断（占位 3 秒）。
qi.enabled=true
qi.cost_per_brew=6.0
qi.grace_seconds=3.0
# 熬药结构（结构由 JAR 里 data/meridian_brewing/structure/ 的三份 NBT 定义）：外框最多缺几格仍算有效。
# 0 表示 NBT 里每个外框格都要有同类方块（任一石头、木头、玻璃、栏杆、锁链）；核心格和必须空的格不算在容差里。
structure.frame_tolerance=0
# 三阶药塔（数值占位）：出药品质上限，写 POOR / COMMON / FINE / SUPERIOR；默认 FINE（精良），优质只能手熬。
tower.quality_cap=FINE
# 火室每格燃料点着后能烧几秒（每秒烧着几格就是几档）：煤炭块按 9 块煤 × 60 秒；原木先给 60 秒；熔岩源顶 12.5 块煤；
# 火只记点着那一刻的 10 秒，之后火灭了不影响。
tower.fuel.coal_block_seconds=540
tower.fuel.log_seconds=60
tower.fuel.lava_seconds=750
tower.fuel.fire_seconds=10
