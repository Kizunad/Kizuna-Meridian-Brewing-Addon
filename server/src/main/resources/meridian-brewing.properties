kidney.ordinary=1.0
kidney.good=1.8
kidney.excellent=2.5
kidney.harmless=4.0
brain.stagger=700
brain.ignore=1200
charm_controls_players=true
# 熬药耗真元（占位数值）：每锅基数，乘釜的系数（铜釜 1.0、巫釜 1.3），熬制 30 秒里每秒付 1/30。
# 先取环境（施法者所在区块的环境真元），不够的再从施法者已开经脉里扣；两边都不够就不起熬。
# 中途两边都付不满就记欠付，之后每秒连欠的一起要；累计欠付超过 grace_seconds 秒的份才中断（占位 3 秒）。
qi.enabled=true
qi.cost_per_brew=6.0
qi.grace_seconds=3.0
# 五行丹露：四档品质喝下各得多少本行真元（元）。对照：灼火一次 0.6、心火一次 0.4。
elixir.qi.poor=0.6
elixir.qi.common=1.0
elixir.qi.fine=1.5
elixir.qi.superior=2.4
# 丹毒：喝下以后留多少秒；丹毒在身时再喝同一行，这一次得的量乘 repeat_factor、丹毒升一级重新计时；
# 到了 max_toxin_level 级再喝，这一次一点不得，只是重新计时。
elixir.toxin_seconds=300
elixir.repeat_factor=0.5
elixir.max_toxin_level=3
# 火行丹毒（内焦）：一、二、三级时饥饿消耗各变成几倍；到了 burn_level 级，每隔 burn_interval_seconds 秒胸口受 burn_hp 点热伤。
elixir.fire.exhaustion=1.5,2.5,2.5
elixir.fire.burn_level=3
elixir.fire.burn_interval_seconds=20
elixir.fire.burn_hp=1.0
# 金、木、水、土丹毒：每级的吐纳摄入、攻击速度、移动速度和跳跃高度相对原值。
elixir.metal.intake=0.8,0.6,0.4
elixir.wood.attack_speed=0.9,0.8,0.7
elixir.water.movement_speed=0.9,0.8,0.7
elixir.earth.jump_height=0.8,0.6,0.6
