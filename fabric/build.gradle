plugins {
    id 'net.fabricmc.fabric-loom'
}

description = '炼药的 26.2 Fabric 注册与世界接线。'

dependencies {
    implementation 'dev.kizuna.meridian.human:server'
    // 药方指令挂在 Framework 的 /meridian 注册点下。
    implementation 'dev.kizuna.meridian:fabric'
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation libs.fabric.api
    implementation project(':server')
    implementation 'dev.kizuna.meridian.vanilla:fabric'
    implementation 'dev.kizuna.meridian.technique:fabric'
    implementation 'dev.kizuna.meridian.technique:server'
    implementation 'dev.kizuna.meridian.technique:shared'
    // 药刀开刃、切药、敷药、副手下料由服务端经 PA 播放；PA 是硬依赖。
    implementation 'dev.kizuna:kizuna-players-animation'
    // 女巫敷药的动作经 PA 的生物附属播放；生物附属是硬依赖。
    implementation 'dev.kizuna:kizuna-players-animation-mobs-addon'
    // 出身附属是硬依赖：登记「开局会的药方」天赋类型；运行时由完整装配装入。
    implementation 'dev.kizuna.meridian.origin:fabric'
    // 物品重量登记在 BS3D 的物品元数据里，由负重附属读取；BS3D 是硬依赖。
    implementation 'dev.kizuna.backpack3d:server'
    include project(':server')
    include project(':shared')
    testImplementation libs.junit4
}

test {
    useJUnit()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    from(project(':shared').sourceSets.main.resources)
}

loom {
    mods {
        meridian_brewing { sourceSet sourceSets.main }
    }
    runs { server { runDir 'build/server' } }
}
