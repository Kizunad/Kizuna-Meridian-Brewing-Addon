description = '炼药规则的独立契约验证。'

dependencies {
    api project(':server')
    implementation 'dev.kizuna.meridian.technique:server'
    testImplementation libs.junit4
}

processResources {
    from(project(':shared').sourceSets.main.resources)
}

test {
    useJUnit()
    // 美术检查读 fabric 模块的贴图源文件，与正式包打进去的是同一份。
    def fabricResources = project(':fabric').file('src/main/resources')
    inputs.dir(fabricResources)
    systemProperty 'brewing.fabricResources', fabricResources.absolutePath
}
