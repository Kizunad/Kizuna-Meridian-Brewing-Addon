plugins {
    id 'base'
    alias(libs.plugins.fabric.loom) apply false
    alias(libs.plugins.protobuf) apply false
}

allprojects {
    group = 'dev.kizuna.meridian.brewing'
    version = '0.1.0'
}

subprojects {
    apply plugin: 'java-library'
    repositories { mavenCentral() }
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(libs.versions.java.get()) }
        withSourcesJar()
    }
    base.archivesName = "${rootProject.name}-${project.name}"
    tasks.withType(JavaCompile).configureEach {
        options.release = libs.versions.java.get().toInteger()
        options.encoding = 'UTF-8'
    }
    tasks.withType(Jar).configureEach {
        from(rootProject.files('LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md'))
    }
}

tasks.named('assemble') {
    dependsOn ':server:assemble', ':fabric:assemble', ':client:assemble'
}

tasks.named('check') {
    dependsOn ':server:check', ':fabric:check', ':client:check', ':verification:test', 'checkDocs', 'checkData',
            'checkModels'
}

tasks.named('clean') {
    dependsOn ':server:clean', ':fabric:clean', ':client:clean', ':verification:clean'
}

tasks.register('test') {
    group = 'verification'
    dependsOn ':server:test', ':fabric:test', ':client:test', ':verification:test'
}

tasks.register('checkDocs', Exec) {
    group = 'verification'
    commandLine 'python3', 'scripts/check_docs.py'
}

tasks.register('checkData', Exec) {
    group = 'verification'
    commandLine 'python3', 'scripts/check_data.py'
}

tasks.register('checkModels', Exec) {
    group = 'verification'
    // 随客户端 JAR 分发的 Bong 模型必须与 sources.json 记的导入结果逐字节一致。
    commandLine 'python3', 'scripts/import_bong_models.py', '--check'
}
