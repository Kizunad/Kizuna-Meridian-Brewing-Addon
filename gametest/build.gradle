plugins { alias(libs.plugins.fabric.loom) }

description = '独立的炼药 Fabric GameTest 装配。'

dependencies {
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation libs.fabric.api
    implementation project(':server')
    implementation project(':fabric')
    implementation 'dev.kizuna.meridian.human:fabric'
    implementation testFixtures('dev.kizuna.meridian.human:fabric')
    implementation 'dev.kizuna.meridian.human:server'
    implementation 'dev.kizuna.meridian.progression:shared'
    implementation 'dev.kizuna.meridian.vanilla:fabric'
    implementation 'dev.kizuna.meridian.vanilla:server'
    implementation testFixtures('dev.kizuna.meridian.technique:fabric')
    implementation('dev.kizuna.meridian.technique:fabric') { transitive = false }
    implementation 'dev.kizuna.meridian.technique:server'
    implementation 'dev.kizuna.meridian.technique:shared'
    // 功法 Fabric 模组硬依赖 Framework；只取功法模块本身时，运行时单独装入 Framework。
    implementation 'dev.kizuna.meridian:fabric'
    // 切药、开刃测试解析真实发出的 PA 播放包。
    implementation 'dev.kizuna:kizuna-players-animation'
    // 重量测试读 BS3D 的物品元数据。
    implementation 'dev.kizuna.backpack3d:server'
}

apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')

processResources {
    from(project(':fabric').sourceSets.main.resources) { exclude 'fabric.mod.json' }
    from(project(':shared').sourceSets.main.resources)
}

loom {
    mods {
        meridian_brewing_test { sourceSet sourceSets.main }
    }
    runs {
        gametest {
            server()
            name '炼药 GameTest'
            runDir providers.gradleProperty('gametestRunDir').getOrElse('build/gametest')
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
            if (providers.gradleProperty('gametestFilter').isPresent()) {
                vmArg "-Dfabric-api.gametest.filter=${providers.gradleProperty('gametestFilter').get()}"
            }
        }
    }
}
